<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101318">
    <title>人物去背與掌心亂碼畫筆</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main class="app-shell">
        <header class="page-header">
            <div class="status-pill" aria-live="polite">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">相機尚未啟動</span>
            </div>
        </header>

        <section class="workspace" aria-label="人物與手部偵測工作區">
            <div class="camera-card">
                <div class="camera-toolbar">
                    <span class="camera-label"><span class="live-indicator"></span>即時預覽</span>
                </div>
                <div class="camera-stage" id="cameraStage" data-mirror="true" data-background-removal="true">
                    <video id="webcam" autoplay playsinline muted aria-label="Webcam 即時影像"></video>
                    <canvas id="personCanvas" aria-label="人物去背畫面"></canvas>
                    <canvas id="particleCanvas" aria-hidden="true"></canvas>
                    <div class="empty-state" id="emptyState">
                        <div class="camera-icon" aria-hidden="true">◎</div>
                        <strong>準備好開始了嗎？</strong>
                        <span>開啟相機後，允許瀏覽器使用 webcam</span>
                    </div>
                    <div class="loading-state" id="loadingState" hidden>
                        <span class="spinner"></span><span>正在載入人物與手部模型…</span>
                    </div>
                </div>
                <div class="camera-footer">
                    <span id="detectionText">尚未偵測人物</span>
                    <span>OK 手勢重新開始</span>
                </div>
            </div>

            <aside class="control-card">
                <div class="control-heading">
                    <p class="eyebrow">控制面板</p>
                    <h2>相機控制</h2>
                </div>
                <button class="primary-button" id="cameraButton" type="button">
                    <span class="button-icon" aria-hidden="true">◉</span>
                    <span id="cameraButtonText">開啟相機</span>
                </button>
                <button class="secondary-button" id="fullscreenButton" type="button" aria-pressed="false">
                    <span class="button-icon" aria-hidden="true">⛶</span>
                    <span id="fullscreenButtonText">畫面全螢幕</span>
                </button>
                <div class="gesture-tip">
                    <span class="tip-icon" aria-hidden="true">↻</span>
                    <p><strong>重新開始</strong><br>比出 OK 手勢並維持 1.5 秒，清除筆跡並恢復人物。</p>
                </div>
                <p class="privacy-note">影像只在此裝置上即時處理，不會上傳。</p>
            </aside>
        </section>
        <p class="page-note" id="noticeText">提示：請使用 localhost 或 HTTPS 開啟頁面，瀏覽器才允許存取相機。</p>
    </main>
    <script type="module" src="./js/script.js"></script>
</body>
</html>
